name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish compatible package set
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci .

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Integration test
        run: bun run test:integration

      - name: End-to-end test
        run: bun run test:e2e

      - name: Replay performance gate
        run: bun run benchmark:replay

      - name: Prepare lockstep version from release tag
        run: bun scripts/release-packages.ts prepare "$GITHUB_REF_NAME"

      - name: Validate release packages
        run: bun run release:check

      - name: Publish compatible package set
        run: |
          dist_tag="$(bun scripts/release-packages.ts dist-tag "$GITHUB_REF_NAME")"
          for package in configuration spec runner web mobile studio cli; do
            (cd "packages/$package" && bun publish --access public --tag "$dist_tag")
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
